<!DOCTYPE html>
<html data-bs-theme="light" lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Register - Brand</title>
    <link rel="stylesheet" href="/static/bootstrap/bootstrap.min.css">
    <link rel="stylesheet" href="/static/css/styles.min.css">
</head>

<body class="bg-gradient-primary">
    <div class="container">
        <div class="card shadow-lg o-hidden border-0 my-5">
            <div class="card-body p-0">
                <div class="row">
                    <div class="col-lg-5 d-none d-lg-flex">
                        <div class="flex-grow-1 bg-register-image" style="background-image: url(&quot;/static/img/dogs/image2.jpeg&quot;);"></div>
                    </div>
                    <div class="col-lg-7">
                        <div class="p-5">
                            <div class="text-center">
                                <h4 class="text-dark mb-4">Create an Account!</h4>
                            </div>
                            <form class="user" action="/signup" method="POST">
                                <div class="row mb-3">
                                    <div class="col-sm-6 mb-3 mb-sm-0"><input class="form-control form-control-user" type="text" id="exampleFirstName" placeholder="First Name" name="first_name"></div>
                                    <div class="col-sm-6"><input class="form-control form-control-user" type="text" id="exampleLastName" placeholder="Last Name" name="last_name"></div>
                                </div>
                                <div class="mb-3">
                                    <div class="col-sm-6 mb-3 mb-sm-0"><input class="form-control form-control-user" type="email" id="exampleInputEmail" aria-describedby="emailHelp" placeholder="Email Address" name="email"><br></div>
                                    <div class="col-sm-6 "><input class="form-control form-control-user" type="text" id="contact"  placeholder="Mobile Number" name="contact"></div><br>
                                    <div class="col-sm-6 "><input class="form-control form-control-user" type="date" id="dob"  placeholder="Date of Birth : yyyy-mm-dd" name="dob"></div>
                                </div>
                                <div>
                                <input class="form-control form-control-user" type="text" id="address" placeholder="Enter your Address" name="address">
                                    <input class="form-control form-control-user" type="text" id="pincode"  placeholder="Enter Pincode" name="pincode" style="margin-top: 15px;margin-bottom: 15px;">
                                </div>
                                
                                <div class="row mb-3" style="margin-top: 5px;margin-bottom: 5px;">
                                    <div class="col-sm-6 mb-3 mb-sm-0"><input class="form-control form-control-user" type="password" id="examplePasswordInput" placeholder="Password" name="password"></div>
                                    <div class="col-sm-6 col-md-6"><input class="form-control form-control-user" type="password" id="exampleRepeatPasswordInput" placeholder="Repeat Password" name="password_repeat"></div>
                                </div>

                            <button class="btn btn-primary d-block btn-user w-100" type="submit">Register Account</button>
                            </form>
                            <div class="err_msg">{{msg}}</div>
                            <hr><a class="btn btn-primary d-block btn-google btn-user w-100 mb-2" href="/prosignup" role="button">&nbsp; Register as a service partner!</a>
                            <hr>
                            <div class="text-center"><a class="small" href="/login">Already have an account? Login!</a></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/script.min.js"></script>
</body>

</html>
